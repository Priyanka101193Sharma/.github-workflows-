name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ubuntu/online-clone-amazon

            git pull origin main

            docker rm -f amazon-container || true

            docker build -t amazon-app .

            docker run -d -p 80:80 --restart always --name amazon-container amazon-app
